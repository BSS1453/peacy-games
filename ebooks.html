<style>
    :root {
      --bg-main: #0b0c10;
      --bg-card: #1f2833;
      --accent-cyan: #66fcf1;
      --accent-dark: #45a29e;
      --text-main: #c5c6c7;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* --- NAVIGATION --- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background: rgba(11, 12, 16, 0.7);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(69, 162, 158, 0.2);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img { width: 200px; height: 50px; object-fit: contain; transition: transform 0.25s ease; }


    .nav-links {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      margin-left: 30px;
      font-weight: 600;
      transition: all 0.3s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: var(--accent-cyan);
      transition: width 0.3s ease;
    }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a:hover { color: var(--accent-cyan); }

    .cart-btn {
      margin-left: 30px;
      background: rgba(31, 40, 51, 0.8);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-btn:hover {
      background: var(--accent-cyan);
      color: var(--bg-main);
      box-shadow: 0 0 20px var(--accent-cyan);
      transform: translateY(-2px);
    }

    /* --- SHOP HEADER --- */
    .shop-header {
      text-align: center;
      padding: 80px 20px 40px;
      background: linear-gradient(-45deg, #0b0c10, #171d26, #0f1821, #0b0c10);
      background-size: 100% 100%;
      border-bottom: 1px solid rgba(102, 252, 241, 0.1);
    }


    .shop-header h1 {
      font-size: 3.5rem;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }

    .shop-header h1 span { color: var(--accent-cyan); text-shadow: 0 0 20px var(--accent-cyan); }
    .shop-header p { font-size: 1.2rem; margin-top: 15px; color: #e0e0e0; }

    /* --- EBOOK GRID --- */
    .ebook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      padding: 60px 8%;
    }

    .ebook-card {
      background: rgba(31, 40, 51, 0.6);
      backdrop-filter: blur(5px);
      border-radius: 15px;
      border: 1px solid rgba(102, 252, 241, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.4s ease;
    }

    .ebook-card.disabled {
      opacity: 0.6;
      filter: grayscale(80%);
    }

    .ebook-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(102, 252, 241, 0.2);
      border-color: rgba(102, 252, 241, 0.5);
    }

    .ebook-cover {
      display: block;
      width: 100%;
      height: 380px;
      object-fit: cover;
      object-position: center;
      transition: transform 0.35s ease;
    }

    .ebook-card:hover .ebook-cover { transform: scale(1.05); }
    .cover-wrapper { overflow: hidden; border-bottom: 2px solid var(--accent-dark); }

    .ebook-content {
      padding: 25px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      background: linear-gradient(to top, var(--bg-card) 80%, transparent);
      z-index: 2;
    }

    .ebook-content h3 { color: var(--text-white); font-size: 1.4rem; margin-bottom: 5px; }
    .ebook-author { font-size: 0.9rem; color: #a0a5aa; margin-bottom: 15px; }
    .ebook-price {
      font-size: 1.6rem; color: var(--accent-cyan); font-weight: bold;
      margin-bottom: 25px; text-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
    }

    .add-to-cart-btn {
      margin-top: auto;
      background: transparent;
      color: var(--accent-cyan);
      border: 2px solid var(--accent-cyan);
      padding: 12px; border-radius: 50px; font-weight: bold;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.4s ease;
    }
    
    .add-to-cart-btn:hover { background: var(--accent-cyan); color: var(--bg-main); box-shadow: 0 0 20px var(--accent-cyan); }

    .add-to-cart-btn:disabled {
      border-color: #555; color: #555; cursor: not-allowed;
      background: transparent; box-shadow: none;
    }

    /* --- CART SIDEBAR & CHECKOUT --- */
    .cart-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease; z-index: 1500;
    }
    .cart-overlay.active { opacity: 1; visibility: visible; }

    .cart-sidebar {
      position: fixed; top: 0; right: -450px;
      width: 450px; max-width: 100%; height: 100vh;
      background: var(--bg-card); border-left: 2px solid var(--accent-cyan);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 2000;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
      display: flex; flex-direction: column;
    }
    .cart-sidebar.open { right: 0; }

    .cart-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 25px; border-bottom: 1px solid rgba(102, 252, 241, 0.2); background: #141a21;
    }
    .cart-header h2 { color: var(--text-white); text-transform: uppercase; }
    .close-cart { background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; }

    .cart-items { flex-grow: 1; overflow-y: auto; padding: 25px; }

    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0b0c10; padding: 15px 20px; border-radius: 10px; margin-bottom: 15px;
      border: 1px solid rgba(102, 252, 241, 0.1);
    }
    .item-info h4 { color: var(--text-white); margin-bottom: 5px; }
    .item-info p { color: var(--accent-cyan); font-weight: bold; }

    .remove-btn { background: none; border: none; color: #ff0055; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }

    .cart-footer { padding: 25px; border-top: 1px solid rgba(102, 252, 241, 0.2); background: #141a21; }
    .cart-total { display: flex; justify-content: space-between; font-size: 1.4rem; color: var(--text-white); margin-bottom: 20px; font-weight: bold; }

    /* --- EMAIL EINGABEFELD --- */
    .email-capture {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
      gap: 8px;
    }
    .email-capture label {
      color: var(--text-main);
      font-size: 0.9rem;
      text-transform: uppercase;
      font-weight: bold;
    }
    .email-capture input {
      padding: 12px 15px;
      border-radius: 8px;
      background: #0b0c10;
      border: 1px solid rgba(102, 252, 241, 0.3);
      color: var(--text-white);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .email-capture input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    .email-capture input::placeholder {
      color: #555;
    }

    #paypal-button-container { margin-top: 5px; }

    /* Processing Overlay */
    .processing-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 12, 16, 0.95); z-index: 3000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; transition: opacity 0.3s;
    }
    .processing-overlay.active { opacity: 1; visibility: visible; }
    
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(102, 252, 241, 0.2);
      border-top-color: var(--accent-cyan); border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: #050608; text-align: center; padding: 40px 20px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 50px; }

    .nav-brand-row { display: flex; align-items: center; min-width: 0; }
    .menu-toggle { display: none; width: 44px; height: 44px; margin-left: 12px; padding: 9px; border: 1px solid rgba(102, 252, 241, 0.45); border-radius: 10px; background: rgba(31, 40, 51, 0.85); color: var(--accent-cyan); cursor: pointer; flex-direction: column; justify-content: center; gap: 5px; }
    .menu-toggle span { display: block; height: 2px; width: 100%; background: currentColor; border-radius: 2px; }
    .menu-toggle:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }
    .store-icon { width: 24px; height: 24px; display: block; }
    @media screen and (max-width: 900px), (max-device-width: 900px) {
      nav { flex-wrap: wrap; gap: 0; padding: 8px 4%; }
      .nav-brand-row { width: 100%; justify-content: space-between; }
      .menu-toggle { display: flex; }
      .nav-links { display: none; width: 100%; flex-direction: column; align-items: stretch; gap: 4px; padding: 10px 0 4px; }
      .nav-links.open { display: flex; }
      .nav-links a, .cart-btn { width: 100%; margin-left: 0; padding: 10px 12px; font-size: 0.95rem; }
      .cart-btn { justify-content: center; }
      .shop-header { padding: 58px 18px 34px; }
      .shop-header h1 { font-size: clamp(2rem, 9vw, 3.2rem); line-height: 1.1; overflow-wrap: anywhere; }
      .shop-header p { font-size: 1rem; }
      .ebook-grid { grid-template-columns: 1fr; padding: 40px 5%; gap: 24px; }
    }
    @media screen and (max-width: 560px), (max-device-width: 560px) {
      .logo-img { width: 180px; height: 45px; max-width: 62vw; }
      .ebook-cover { height: 300px; }
    }

</style>

        🛒 Cart <span id="cart-count" style="background: var(--accent-cyan); color: #000; padding: 2px 8px; border-radius: 10px;">0</span>
</button>
</div>
</nav>
<div class="shop-header">
<h1>Peacy <span>Ebooks</span></h1>
<p>Dive deep into our lore, art, and game development secrets.</p>
</div>
<div class="ebook-grid" id="shopGrid"></div>
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
<div class="processing-overlay" id="processingOverlay">
<div class="spinner"></div>
<h3 style="color: var(--accent-cyan); margin-top: 15px;">Processing...</h3>
</div>
<div class="cart-header">
<h2>Your Cart</h2>
<button class="close-cart" onclick="toggleCart()">✖</button>
</div>
<div class="cart-items" id="cartItemsContainer"></div>
<div class="cart-footer">
<div class="cart-total">
<span>Total:</span>
<span id="cartTotalValue">$0.00</span>
</div>
<div class="email-capture">
<label for="buyerEmail">Email for Delivery</label>
<input id="buyerEmail" placeholder="you@example.com" required="" type="email"/>
</div>
<div id="paypal-button-container"></div>
</div>
</div>
<footer>
<p>© 2026 Peacy Games. All rights reserved. · <a href="games/index.html" style="color: var(--accent-cyan);">Games</a> · <a href="press/index.html" style="color: var(--accent-cyan);">Press</a></p>
<p class="imprint-footer-link" style="margin:8px 0 0; text-align:center; font-size:.75rem; opacity:.72;"><a href="impressum.html" style="color:inherit; text-decoration:underline;">Impressum</a> · <a href="datenschutz.html" style="color:inherit; text-decoration:underline;">Datenschutz</a></p>
</footer>
<script>
    // SICHERHEIT: Webhook-URL entfernt. Lokale Dateinamen ('filename') entfernt, da die Auslieferung sicher über Make.com aus dem Google Drive erfolgt.

    const menuToggle = document.querySelector('.menu-toggle');
    const shopMenu = document.getElementById('shop-menu');
    if (menuToggle && shopMenu) {
      menuToggle.addEventListener('click', () => {
        const open = shopMenu.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', String(open));
        menuToggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      });
      shopMenu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
        shopMenu.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'Open navigation menu');
      }));
    }

    const products = [
      {
        index: 0,
        title: "Tic Tac Toe in Python",
        author: "Peacy Games",
        price: 4.90, // Echter Preis wiederhergestellt
        image: "https://images.unsplash.com/photo-1526379095098-d400fd0bfce8?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80",
        available: true
      },
      {
        index: 1,
        title: "Coming Soon",
        author: "Peacy Games",
        price: 0.00,
        image: "https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80",
        available: false
      }
    ];

    let cart = [];

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';

      products.forEach((prod) => {
        const btnHTML = prod.available 
          ? `<button class="add-to-cart-btn" onclick="addToCart(${prod.index})">Add to Cart</button>`
          : `<button class="add-to-cart-btn" disabled>Unavailable</button>`;

        const cardClass = prod.available ? "ebook-card" : "ebook-card disabled";

        grid.innerHTML += `
          <div class="${cardClass}">
            <div class="cover-wrapper">
              <img class="ebook-cover defer-img" src="ebook-placeholder.svg" data-src="${prod.image}" alt="${prod.title} ebook cover" width="600" height="380" loading="lazy" decoding="async">
            </div>
            <div class="ebook-content">
              <h3>${prod.title}</h3>
              <p class="ebook-author">by ${prod.author}</p>
              <p class="ebook-price">${prod.available ? '$' + prod.price.toFixed(2) : '---'}</p>
              ${btnHTML}
            </div>
          </div>
        `;
      });
    }

    function toggleCart() {
      document.getElementById('cartSidebar').classList.toggle('open');
      document.getElementById('cartOverlay').classList.toggle('active');
    }

    function addToCart(index) {
      const product = products[index];
      if (!product || !product.available) return;

      if (cart.includes(index)) {
        alert("This ebook is already in your cart!");
        return;
      }
      
      cart.push(index);
      updateCartUI();
      loadPayPalSDK().then(initPayPal).catch(() => { paypalRendered = false; });
      
      const sidebar = document.getElementById('cartSidebar');
      if(!sidebar.classList.contains('open')) toggleCart();
    }

    function removeFromCart(index) {
      cart = cart.filter(cartIndex => cartIndex !== index);
      updateCartUI();
    }

    function getCartTotal() {
      return cart.reduce((sum, index) => sum + products[index].price, 0).toFixed(2);
    }

    function updateCartUI() {
      const container = document.getElementById('cartItemsContainer');
      document.getElementById('cart-count').innerText = cart.length;

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-main); margin-top: 20px;">Your cart is empty.</p>';
        document.getElementById('cartTotalValue').innerText = "$0.00";
        return;
      }

      let html = '';
      cart.forEach(index => {
        const prod = products[index];
        html += `
          <div class="cart-item">
            <div class="item-info">
              <h4>${prod.title}</h4>
              <p>$${prod.price.toFixed(2)}</p>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
          </div>
        `;
      });
      container.innerHTML = html;
      document.getElementById('cartTotalValue').innerText = "$" + getCartTotal();
    }

    // --- PAYPAL NUR BEI BEDARF LADEN (bessere Start-Performance) ---
    let paypalLoadPromise = null;
    let paypalRendered = false;
    function loadPayPalSDK() {
      if (window.paypal) return Promise.resolve();
      if (paypalLoadPromise) return paypalLoadPromise;
      paypalLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://www.paypal.com/sdk/js?client-id=BAABqjTrJW3wiownOoNWddD8o92eP8Hxd95jMOFsD4-lxhZAMSRejnL2i-Ur7Oy-RQlLcLhrAR6kopDGnY&currency=USD';
        script.async = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return paypalLoadPromise;
    }

    // --- SICHERE PAYPAL LOGIK ---
    function initPayPal() {
      if (paypalRendered || !window.paypal) return;
      paypalRendered = true;
      paypal.Buttons({
        onClick: function(data, actions) {
          const emailInput = document.getElementById('buyerEmail');
          
          if(cart.length === 0) { 
            alert("Your cart is empty!"); 
            return actions.reject(); 
          }
          
          if(!emailInput.value || !emailInput.value.includes('@')) {
            alert("Please enter a valid email address so we can deliver your items.");
            emailInput.focus();
            return actions.reject();
          }
          
          return actions.resolve();
        },
        
        createOrder: function(data, actions) {
          const buyerEmail = document.getElementById('buyerEmail').value;
          
          return actions.order.create({ 
            purchase_units: [{ 
              amount: { 
                value: getCartTotal() 
              },
              // WICHTIG: Die E-Mail wird sicher über PayPal an Make.com übergeben (kein direkter Fetch mehr)
              custom_id: buyerEmail 
            }],
            payer: {
              email_address: buyerEmail
            }
          });
        },
        
        onApprove: function(data, actions) {
          document.getElementById('processingOverlay').classList.add('active');
          return actions.order.capture().then(function(details) {
            document.getElementById('processingOverlay').classList.remove('active');
            
            // Zahlung erfolgreich bei PayPal bestätigt!
            const buyerEmail = document.getElementById('buyerEmail').value;
            handleSuccessfulPayment(details.payer.name.given_name, details.id, buyerEmail);
          });
        }
      }).render('#paypal-button-container');
    }

    // --- ABSCHLUSS NACH ERFOLGREICHER ZAHLUNG ---
    function handleSuccessfulPayment(buyerName, transactionId, buyerEmail) {
      // SICHERHEIT: Keine lokalen Fallback-Downloads mehr. Der Versand erfolgt ausschließlich über das Backend/Make.com.
      // Keine Webhook URL im Code sichtbar.
      
      const successMessage = `Payment Successful!\n\nThank you for your purchase, ${buyerName}. Your transaction ID is ${transactionId}.\n\nAn automated email containing your Ebook is currently being processed and will be delivered to:\n${buyerEmail}\n\nPlease check your inbox (and spam folder) shortly.`;
      
      alert(successMessage);

      // Warenkorb aufräumen
      cart = [];
      document.getElementById('buyerEmail').value = '';
      updateCartUI();
      toggleCart();
    }

    renderShop();
    const deferredImages = document.querySelectorAll('img.defer-img[data-src]');
    if ('IntersectionObserver' in window) {
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const img = entry.target;
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          observer.unobserve(img);
        });
      }, { rootMargin: '0px 0px 80px 0px' });
      deferredImages.forEach(img => imageObserver.observe(img));
    }

    updateCartUI();

  </script>
</body>
</html>
